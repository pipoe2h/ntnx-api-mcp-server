services:
  nutanix-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: nutanix/ntnx-api-mcp-server:latest
    container_name: ntnx-api-mcp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PC_HOST: ${PC_HOST:-}
      PC_PORT: ${PC_PORT:-9440}
      PC_USERNAME: ${PC_USERNAME:-}
      PC_PASSWORD: ${PC_PASSWORD:-}
      PC_INSECURE: ${PC_INSECURE:-true}
      ARTIFACTS_DIR: /app/artifacts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      NAMESPACE_SOURCE_URL: ${NAMESPACE_SOURCE_URL:-https://developers.nutanix.com/api/v1/namespaces}
      NAMESPACE_OVERRIDE_LIST: ${NAMESPACE_OVERRIDE_LIST:-}
    volumes:
      - ./artifacts:/app/artifacts
      - ./.env:/app/.env
    command: ["run"]
