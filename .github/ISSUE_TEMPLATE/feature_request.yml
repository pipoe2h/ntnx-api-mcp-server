name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Have an idea for improving the Nutanix MCP Server? We'd love to hear it.

  - type: textarea
    id: description
    attributes:
      label: What feature or improvement would you like?
      description: A clear description of what you are proposing.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Why do you need this?
      description: Describe the problem this solves or the workflow it enables.
    validations:
      required: true

  - type: textarea
    id: prompts
    attributes:
      label: Example prompts or workflows
      description: |
        If applicable, share 2–3 example natural-language prompts or step-by-step workflows this feature would enable.
      placeholder: |
        Example:
        - "Show me all VMs with more than 8 vCPUs across all clusters"
        - "Compare storage utilization between two clusters and suggest rebalancing"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought about.
    validations:
      required: false
